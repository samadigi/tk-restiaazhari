      left: -12px;
      top: -12px;
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 4px 6px rgba(30, 58, 109, 0.16));
      animation: tkFlowerBurst var(--dur, 0.78s) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes tkFlowerRipple {
      0% {
        transform: scale(0.2);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.85);
        opacity: 0;
      }
    }

    @keyframes tkFlowerCenterPop {
      0% {
        transform: scale(0.15) rotate(-25deg);
        opacity: 0;
      }
      35% {
        transform: scale(1.18) rotate(12deg);
        opacity: 1;
      }
      70% {
        transform: scale(0.95) rotate(22deg) translateY(-6px);
        opacity: 0.9;
      }
      100% {
        transform: scale(0.55) rotate(36deg) translateY(-14px);
        opacity: 0;
      }
    }

    @keyframes tkFlowerBurst {
      0% {
        transform: translate3d(0, 0, 0) scale(0.25) rotate(0deg);
        opacity: 0;
      }
      18% {
        opacity: 1;
      }
      72% {
        opacity: 0.95;

      100% {
        transform: translate3d(var(--tx, 0px), var(--ty, 0px), 0) scale(var(--sc, 1)) rotate(var(--rot, 120deg));
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tk-flower-ripple,
      .tk-flower-particle {
        display: none !important;
      }
      .tk-flower-center {
        animation: tkFlowerRipple 0.45s ease-out forwards !important;
      }

    // =========================================================================
    // UTILITAS UI (TOAST, MODAL, ESCAPE, KOMPRESI GAMBAR)
    // =========================================================================
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'success') {
      const host = document.getElementById('tk-toast-host');
      if (!host) return;
      const el = document.createElement('div');
      const tone =
        type === 'error'
          ? 'bg-rose-500 text-white border-rose-300'
          : type === 'info'
          ? 'bg-sky-500 text-white border-sky-300'
          : 'bg-emerald-500 text-white border-emerald-300';
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border-2 shadow-xl text-xs font-extrabold flex items-center justify-between gap-3 transition-all duration-300 ${tone}`;
      el.innerHTML = `<span>${esc(message)}</span>`;
      host.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 260);
      }, 3400);
    }

    function openModal(innerHtml) {
      const host = document.getElementById('tk-modal-host');
      if (!host) return;
      host.innerHTML = `
        <div class="clay-surface relative w-full max-w-lg max-h-[88vh] overflow-y-auto p-6 sm:p-7 animate-fade">
          <button type="button" id="btn-close-modal" aria-label="Tutup" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-600 flex items-center justify-center transition">
            ${iconSvg('close', 'w-5 h-5')}
          </button>
          <div class="pr-6">${innerHtml}</div>
        </div>
      `;
      host.classList.remove('hidden');
      host.classList.add('flex');
      document.getElementById('btn-close-modal')?.addEventListener('click', closeModal);
      host.onclick = (e) => {
        if (e.target === host) closeModal();
      };
    }

    function closeModal() {
      const host = document.getElementById('tk-modal-host');
      if (!host) return;
      host.classList.add('hidden');
      host.classList.remove('flex');
      host.innerHTML = '';
    }

    function compressImageFile(file, maxWidth = 800, quality = 0.68) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith('image/')) {
          reject(new Error('File yang dipilih harus berupa gambar (JPG, PNG, atau WEBP).'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Format gambar tidak dapat diproses browser.'));
          img.onload = () => {
            try {
              const scale = Math.min(1, maxWidth / Math.max(img.width, 1));
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              resolve(dataUrl);
            } catch (_) {
              reject(new Error('Gagal mengompresi gambar.'));
            }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function colorfulTitleHtml(text) {
      const palette = ['#EC4883', '#F59E1D', '#7EC845', '#3DA5F5', '#8B5CF6', '#F43F5E', '#10B981'];
      return String(text || '').split('').map((ch, i) => {
        if (ch === ' ') return '<span>&nbsp;</span>';
        const col = palette[i % palette.length];
        return `<span style="color:${col}; text-shadow: 0 2px 0 rgba(255,255,255,0.95);">${esc(ch)}</span>`;
      }).join('');
    }

    // =========================================================================
    // DATA LAYER (STRICT DUAL-MODE: IN-MEMORY VS FIRESTORE MURNI)
    // =========================================================================
    async function loadPublicData() {
      if (IS_PREVIEW || !db) return;
      const { doc, getDoc, collection, getDocs } = fbStoreFns;
      try {
        const setSnap = await getDoc(doc(db, 'pengaturan', 'profil_tk'));
        if (setSnap.exists()) {
          const data = setSnap.data();
          state.pengaturan = {
            ...DEFAULT_PENGATURAN,
            ...data,
            gambar: { ...DEFAULT_PENGATURAN.gambar, ...(data.gambar || {}) },
            sosmed: { ...DEFAULT_PENGATURAN.sosmed, ...(data.sosmed || {}) }
          };
        }
        const [beritaSnap, galeriSnap] = await Promise.all([
          getDocs(collection(db, 'berita')),
          getDocs(collection(db, 'galeri'))
        ]);
        state.berita = beritaSnap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(b.tanggal || b.createdAt || '').localeCompare(String(a.tanggal || a.createdAt || '')));
        state.galeri = galeriSnap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
      } catch (err) {
        console.error('Gagal memuat data publik:', err);
      }
    }

    async function loadOrtuData(siswaUsername) {
      if (IS_PREVIEW || !db) return;
      const { collection, query, where, getDocs } = fbStoreFns;
      try {
        const q = query(collection(db, 'perkembangan'), where('siswaUsername', '==', siswaUsername));
        const snap = await getDocs(q);
        state.perkembangan = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(b.tanggal || '').localeCompare(String(a.tanggal || '')));
        await loadPublicData();
      } catch (err) {
        console.error('Gagal memuat data orang tua:', err);
      }
    }

    async function loadAdminCollections() {
      if (IS_PREVIEW || !db) return;
      const { collection, getDocs } = fbStoreFns;
      try {
        await loadPublicData();
        const [uSnap, pkSnap, ppdbSnap] = await Promise.all([
          getDocs(collection(db, 'users_ortu')),
          getDocs(collection(db, 'perkembangan')),
          getDocs(collection(db, 'pendaftaran'))
        ]);
        state.users_ortu = uSnap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
        state.perkembangan = pkSnap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(b.tanggal || '').localeCompare(String(a.tanggal || '')));
        state.pendaftaran = ppdbSnap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
      } catch (err) {
        console.error('Gagal memuat koleksi admin:', err);
        showToast('Sebagian data admin gagal dimuat. Periksa Firestore Rules.', 'error');
      }
    }

    async function createRecord(colName, payload) {
      const record = {
        ...payload,
        createdAt: new Date().toISOString().slice(0, 10)
      };
      if (IS_PREVIEW) {
        const newItem = { id: `${colName}_${Date.now()}`, ...record };
        state[colName] = [newItem, ...(state[colName] || [])];
        return newItem;
      }
      if (!db) throw new Error('Firestore belum terinisialisasi.');
      const { collection, addDoc } = fbStoreFns;
      const ref = await addDoc(collection(db, colName), record);
      const saved = { id: ref.id, ...record };
      state[colName] = [saved, ...(state[colName] || [])];
      return saved;
    }

    async function updateRecord(colName, id, patch) {
      if (IS_PREVIEW) {
        state[colName] = (state[colName] || []).map(item =>
          item.id === id ? { ...item, ...patch } : item
        );
        return;
      }
      if (!db) throw new Error('Firestore belum terinisialisasi.');
      const { doc, updateDoc } = fbStoreFns;
      await updateDoc(doc(db, colName, id), patch);
      state[colName] = (state[colName] || []).map(item =>
        item.id === id ? { ...item, ...patch } : item
      );
    }

    async function deleteRecord(colName, id) {
      if (IS_PREVIEW) {
        state[colName] = (state[colName] || []).filter(item => item.id !== id);
        return;
      }
      if (!db) throw new Error('Firestore belum terinisialisasi.');
      const { doc, deleteDoc } = fbStoreFns;
      await deleteDoc(doc(db, colName, id));
      state[colName] = (state[colName] || []).filter(item => item.id !== id);
    }

    async function savePengaturan(payload) {
      const merged = {
        ...state.pengaturan,
        ...payload,
        gambar: { ...DEFAULT_PENGATURAN.gambar, ...(state.pengaturan.gambar || {}), ...(payload.gambar || {}) },
        sosmed: { ...DEFAULT_PENGATURAN.sosmed, ...(state.pengaturan.sosmed || {}), ...(payload.sosmed || {}) }
      };
      if (IS_PREVIEW) {
        state.pengaturan = merged;
        return;
      }
      if (!db) throw new Error('Firestore belum terinisialisasi.');
      const { doc, setDoc } = fbStoreFns;
      await setDoc(doc(db, 'pengaturan', 'profil_tk'), merged, { merge: true });
      state.pengaturan = merged;
    }

    // =========================================================================
    // AUTENTIKASI HYBRID (ADMIN: FIREBASE AUTH | ORTU: VALIDASI FIRESTORE)
    // =========================================================================
    async function loginOrtu(username, password) {
      const uClean = String(username || '').trim();
      const pClean = String(password || '').trim();
      if (!uClean || !pClean) throw new Error('ID Siswa dan Password wajib diisi.');

      if (IS_PREVIEW) {
        const found = state.users_ortu.find(u => u.username.toLowerCase() === uClean.toLowerCase() && u.password === pClean);
        if (!found) throw new Error('ID Siswa atau Password tidak sesuai.');
        state.currentUser = { role: 'ortu', ...found };
        state.view = 'ortu';
        state.ortuTab = 'ringkasan';
        return;
      }

      if (!db) throw new Error('Koneksi Firestore belum siap.');
      const { collection, query, where, getDocs } = fbStoreFns;
      const q = query(collection(db, 'users_ortu'), where('username', '==', uClean));
      const snap = await getDocs(q);
      if (snap.empty) throw new Error('ID Siswa tidak ditemukan.');
      const matched = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .find(d => d.password === pClean);
      if (!matched) throw new Error('Password tidak sesuai.');
      state.currentUser = { role: 'ortu', ...matched };
      await loadOrtuData(matched.username);
      state.view = 'ortu';
      state.ortuTab = 'ringkasan';
    }

    async function loginAdmin(email, password) {
      const eClean = String(email || '').trim();
      const pClean = String(password || '').trim();
      if (!eClean || !pClean) throw new Error('Email dan Password Admin wajib diisi.');

      if (IS_PREVIEW) {
        if (eClean === 'admin@tkrestiiaazhari.sch.id' && pClean === 'admin123') {
          state.currentUser = { role: 'admin', email: eClean, nama: 'Kepala Sekolah / Admin' };
          state.view = 'admin';
          state.adminTab = 'dashboard';
          return;
        }
        throw new Error('Gunakan akun demo Admin yang tertera di bawah form.');
      }

      if (!auth || !fbAuthFns.signInWithEmailAndPassword) {
        throw new Error('Firebase Authentication belum siap.');
      }
      const cred = await fbAuthFns.signInWithEmailAndPassword(auth, eClean, pClean);
      state.currentUser = {
        role: 'admin',
        email: cred.user.email,
        uid: cred.user.uid,
        nama: 'Admin Sekolah'
      };
      await loadAdminCollections();
      state.view = 'admin';
      state.adminTab = 'dashboard';
    }

    async function logoutUser() {
      if (!IS_PREVIEW && state.currentUser?.role === 'admin' && auth && fbAuthFns.signOut) {
        try {
          await fbAuthFns.signOut(auth);
        } catch (_) {}
      }
      state.currentUser = null;
      state.view = 'public';
      showToast('Anda telah keluar dari portal.', 'info');
      render();
    }

    // =========================================================================
    // HERO INTERACTIVE MOTION (3D TILT + PARALLAX + CURSOR SPOTLIGHT)
    // =========================================================================
    function bindHeroMotion() {
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isTouch = window.matchMedia('(pointer: coarse)').matches;
      if (prefersReduced || isTouch) return;

      const hero = document.getElementById('sec-hero');
      const tiltCard = document.getElementById('hero-tilt-card');
      const spotlight = document.getElementById('hero-spotlight');
      if (!hero || !tiltCard) return;

      const parallaxEls = hero.querySelectorAll('[data-parallax]');

      hero.addEventListener('mousemove', (e) => {
        const rect = hero.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width;
        const relY = (e.clientY - rect.top) / rect.height;

        if (spotlight) {
          spotlight.style.setProperty('--spot-x', `${(relX * 100).toFixed(1)}%`);
          spotlight.style.setProperty('--spot-y', `${(relY * 100).toFixed(1)}%`);
        }

        const rotY = (relX - 0.5) * 14 - 4;
        const rotX = (0.5 - relY) * 10 + 2;
        tiltCard.style.transform = `perspective(1000px) rotateY(${rotY.toFixed(2)}deg) rotateX(${rotX.toFixed(2)}deg)`;

        parallaxEls.forEach(el => {
          const depth = parseFloat(el.getAttribute('data-parallax')) || 10;
          const dx = (relX - 0.5) * depth;
          const dy = (relY - 0.5) * depth;
          el.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0)`;

      });

        });
      });
    }

    // EFEK POP-UP SPLASH BUNGA PADA KURSOR / SENTUHAN LAYAR
    // =========================================================================
    function createFlowerSvg(petalColor, centerColor, variant = 0) {
      if (variant === 1) {
        // Kelopak kecil melayang
        return `
          <svg viewBox="0 0 28 28" class="w-full h-full" fill="none">
            <path d="M14 3C19 7.5 21 13.5 14 24C7 13.5 9 7.5 14 3Z" fill="${petalColor}" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M14 7.5C15.5 10.5 15.5 14.5 14 18.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
          </svg>
        `;
      }
      // Bunga 5 kelopak ceria bergaya Claymorphism
      return `
        <svg viewBox="0 0 40 40" class="w-full h-full" fill="none">
          <g stroke="#FFFFFF" stroke-width="1.6">
            <circle cx="20" cy="9.5" r="6.8" fill="${petalColor}"/>
            <circle cx="30" cy="16.8" r="6.8" fill="${petalColor}"/>
            <circle cx="26.2" cy="28.5" r="6.8" fill="${petalColor}"/>
            <circle cx="13.8" cy="28.5" r="6.8" fill="${petalColor}"/>
            <circle cx="10" cy="16.8" r="6.8" fill="${petalColor}"/>
          </g>
          <circle cx="20" cy="20" r="6.2" fill="${centerColor}" stroke="#FFFFFF" stroke-width="1.8"/>
          <circle cx="18.2" cy="18.2" r="1.6" fill="#FFFFFF" opacity="0.8"/>
        </svg>
      `;
    }

    function initFlowerSplashEffect() {
      const layer = document.getElementById('tk-flower-splash-layer');
      if (!layer) return;

      const flowerThemes = [
        { petal: '#EC4883', center: '#FDE047' }, // Pink ceria
        { petal: '#3DA5F5', center: '#FEF08A' }, // Biru langit
        { petal: '#F59E1D', center: '#FFFBEB' }, // Oranye hangat
        { petal: '#7EC845', center: '#FEF08A' }, // Hijau daun
        { petal: '#A855F7', center: '#FDE047' }, // Ungu pastel
        { petal: '#FB7185', center: '#FEF9C3' }  // Koral lembut
      ];

      let lastSplashAt = 0;

      document.addEventListener('pointerdown', (e) => {
        const now = Date.now();
        if (now - lastSplashAt < 55) return;
        lastSplashAt = now;

        const x = e.clientX;
        const y = e.clientY;
        if (typeof x !== 'number' || typeof y !== 'number') return;

        // Jaga performa DOM jika layar diketuk sangat cepat
        while (layer.childElementCount >= 14) {
          layer.firstElementChild?.remove();
        }

        const group = document.createElement('div');
        group.className = 'tk-splash-group';
        group.style.left = `${x}px`;
        group.style.top = `${y}px`;

        const mainTheme = flowerThemes[Math.floor(Math.random() * flowerThemes.length)];

        // 1. Lingkaran riak pastel
        const ripple = document.createElement('div');
        ripple.className = 'tk-flower-ripple';
        ripple.style.setProperty('--ripple-color', mainTheme.petal);
        group.appendChild(ripple);

        // 2. Pop-up bunga utama di titik kursor/sentuhan
        const centerFlower = document.createElement('div');
        centerFlower.className = 'tk-flower-center';
        centerFlower.innerHTML = createFlowerSvg(mainTheme.petal, mainTheme.center, 0);
        group.appendChild(centerFlower);

        // 3. Percikan 7 bunga & kelopak kecil menyebar ke segala arah
        const count = 7;
        for (let i = 0; i < count; i++) {
          const theme = flowerThemes[(i + Math.floor(Math.random() * flowerThemes.length)) % flowerThemes.length];
          const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.45 - 0.22);
          const dist = 34 + Math.random() * 34;
          const tx = Math.cos(angle) * dist;
          const ty = Math.sin(angle) * dist - 6;
          const scale = (0.65 + Math.random() * 0.55).toFixed(2);
          const rot = `${Math.round((Math.random() > 0.5 ? 1 : -1) * (80 + Math.random() * 140))}deg`;
          const dur = `${(0.62 + Math.random() * 0.24).toFixed(2)}s`;

          const particle = document.createElement('div');
          particle.className = 'tk-flower-particle';
          particle.style.setProperty('--tx', `${tx.toFixed(1)}px`);
          particle.style.setProperty('--ty', `${ty.toFixed(1)}px`);
          particle.style.setProperty('--sc', scale);
          particle.style.setProperty('--rot', rot);
          particle.style.setProperty('--dur', dur);
          particle.innerHTML = createFlowerSvg(theme.petal, theme.center, i % 3 === 0 ? 1 : 0);
          group.appendChild(particle);
        }

        layer.appendChild(group);

        setTimeout(() => {
          group.remove();
        }, 920);
      }, { passive: true });
    }

    async function bootstrap() {
      initFlowerSplashEffect();
      if (IS_PREVIEW) {
        loadPreviewDummyData();
        render();

      }

      await loadPublicData();
      render();

      if (auth && fbAuthFns.onAuthStateChanged) {
        fbAuthFns.onAuthStateChanged(auth, async (user) => {
          if (user) {
            state.currentUser = {
              role: 'admin',
              email: user.email,
              uid: user.uid,
              nama: 'Admin Sekolah'
            };
            await loadAdminCollections();
            if (state.view === 'admin') {
              render();
            }
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
