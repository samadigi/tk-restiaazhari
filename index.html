    // =========================================================================
    // HELPER UI: ESCAPE HTML, TOAST, CUSTOM MODAL & FALLBACK GAMBAR
    // =========================================================================
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const FALLBACK_IMG = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#e0f2fe"/><circle cx="200" cy="135" r="55" fill="#facc15"/><circle cx="182" cy="128" r="6" fill="#1e3a6d"/><circle cx="218" cy="128" r="6" fill="#1e3a6d"/><path d="M180 150 Q200 168 220 150" stroke="#1e3a6d" stroke-width="5" fill="none" stroke-linecap="round"/><text x="200" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e3a6d">TK Restiia Azhari</text></svg>`
    );

    window.handleImgError = function(el) {
      el.onerror = null;
      el.src = FALLBACK_IMG;
    };

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-500 text-white',
        error: 'bg-rose-500 text-white',
        info: 'bg-sky-500 text-white'
      };
      const icon = type === 'success' ? '✨' : type === 'error' ? '⚠️' : 'ℹ️';
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-5 py-3.5 rounded-2xl shadow-xl font-bold text-sm flex items-center gap-2.5 transform transition-all duration-300 translate-x-6 opacity-0 ${colors[type] || colors.info}`;
      toast.style.boxShadow = '6px 10px 24px rgba(30,58,109,0.22), inset -3px -3px 8px rgba(0,0,0,0.15), inset 3px 3px 8px rgba(255,255,255,0.35)';
      toast.innerHTML = `<span>${icon}</span><span>${esc(message)}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-6', 'opacity-0');
      });
      setTimeout(() => {
        toast.classList.add('translate-x-6', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3400);
    }

    function openModal(htmlContent) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="clay-surface w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 sm:p-8 relative animate-[fadeIn_0.2s_ease]">
          <button type="button" id="close-modal-btn" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-rose-100 text-rose-600 font-bold flex items-center justify-center hover:bg-rose-200 transition" aria-label="Tutup">✕</button>
          ${htmlContent}
        </div>
      `;
      root.classList.remove('hidden');
      root.classList.add('flex');
      document.getElementById('close-modal-btn').onclick = closeModal;
      root.onclick = (e) => { if (e.target === root) closeModal(); };
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
      root.innerHTML = '';
    }

    function confirmModal(title, message, onConfirm) {
      openModal(`
        <div class="text-center py-2">
          <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center text-3xl shadow-inner">🗑️</div>
          <h3 class="text-2xl font-display font-bold text-clayNavy mb-2">${esc(title)}</h3>
          <p class="text-slate-600 mb-6">${esc(message)}</p>
          <div class="flex justify-center gap-3">
            <button type="button" id="modal-cancel-btn" class="clay-btn-white px-6 py-2.5 font-bold text-sm">Batal</button>
            <button type="button" id="modal-confirm-btn" class="clay-btn-pink px-6 py-2.5 font-bold text-sm">Ya, Hapus</button>
          </div>
        </div>
      `);
      document.getElementById('modal-cancel-btn').onclick = closeModal;
      document.getElementById('modal-confirm-btn').onclick = async () => {
        closeModal();
        await onConfirm();
      };
    }

    // =========================================================================
    // LAYER DATA SERVICE (STRICT DUAL-MODE: IN-MEMORY vs FIRESTORE)
    // =========================================================================
    async function loadPublicData() {
      if (IS_PREVIEW) return; // Mode Preview: tetap di memori
      if (!db) return;
      try {
        // 1. Pengaturan
        const setSnap = await getDoc(doc(db, 'pengaturan', 'profil_tk'));
        if (setSnap.exists()) {
          state.pengaturan = { ...DEFAULT_PENGATURAN, ...setSnap.data() };
        }
        // 2. Berita
        const beritaSnap = await getDocs(query(collection(db, 'berita'), orderBy('tanggal', 'desc')));
        state.berita = beritaSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        // 3. Galeri
        const galSnap = await getDocs(collection(db, 'galeri'));
        state.galeri = galSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (err) {
        console.error("Gagal memuat data publik Firestore:", err);
      }
    }

    async function loadAdminData() {
      if (IS_PREVIEW) return;
      if (!db) return;
      try {
        await loadPublicData();
        const [ortuSnap, perkSnap, ppdbSnap] = await Promise.all([
          getDocs(collection(db, 'users_ortu')),
          getDocs(query(collection(db, 'perkembangan'), orderBy('tanggal', 'desc'))),
          getDocs(collection(db, 'pendaftaran'))
        ]);
        state.users_ortu = ortuSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.perkembangan = perkSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.pendaftaran = ppdbSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (err) {
        console.error("Gagal memuat data admin:", err);
        showToast("Gagal memuat sebagian data dari Firestore.", "error");
      }
    }

    async function loadOrtuData(username) {
      if (IS_PREVIEW) return;
      if (!db) return;
      try {
        await loadPublicData();
        const perkSnap = await getDocs(query(collection(db, 'perkembangan'), where('siswaUsername', '==', username)));
        state.perkembangan = perkSnap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));
      } catch (err) {
        console.error("Gagal memuat data perkembangan anak:", err);
      }
    }

    // CRUD Operations (Dual-Mode)
    async function createItem(colName, payload) {
      if (IS_PREVIEW) {
        const newItem = { id: colName + '-' + Date.now(), ...payload };
        state[colName].unshift(newItem);
        return newItem;
      }
      const ref = await addDoc(collection(db, colName), { ...payload, createdAt: serverTimestamp() });
      const newItem = { id: ref.id, ...payload };
      state[colName].unshift(newItem);
      return newItem;
    }

    async function updateItem(colName, id, payload) {
      if (IS_PREVIEW) {
        const idx = state[colName].findIndex(x => x.id === id);
        if (idx !== -1) state[colName][idx] = { ...state[colName][idx], ...payload };
        return;
      }
      await updateDoc(doc(db, colName, id), payload);
      const idx = state[colName].findIndex(x => x.id === id);
      if (idx !== -1) state[colName][idx] = { ...state[colName][idx], ...payload };
    }

    async function deleteItem(colName, id) {
      if (IS_PREVIEW) {
        state[colName] = state[colName].filter(x => x.id !== id);
        return;
      }
      await deleteDoc(doc(db, colName, id));
      state[colName] = state[colName].filter(x => x.id !== id);
    }

    async function savePengaturan(payload) {
      if (IS_PREVIEW) {
        state.pengaturan = { ...state.pengaturan, ...payload };
        return;
      }
      await setDoc(doc(db, 'pengaturan', 'profil_tk'), payload, { merge: true });
      state.pengaturan = { ...state.pengaturan, ...payload };
    }

    // =========================================================================
    // INTERAKSI HERO (3D MOUSE TILT, PARALLAX, CURSOR SPOTLIGHT - NON-TOUCH)
    // =========================================================================
    function initHeroInteractions() {
      const isTouch = window.matchMedia('(pointer: coarse)').matches;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (isTouch || reducedMotion) return;

      const hero = document.getElementById('sec-beranda');
      const tiltCard = document.getElementById('hero-tilt-card');
      const spotlight = document.getElementById('hero-spotlight');
      if (!hero || !tiltCard) return;

      hero.addEventListener('mousemove', (e) => {
        const rect = hero.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const nx = (x / rect.width) - 0.5;
        const ny = (y / rect.height) - 0.5;

        if (spotlight) {
          spotlight.style.setProperty('--spot-x', `${x}px`);
          spotlight.style.setProperty('--spot-y', `${y}px`);
        }

        const rotY = -6 + nx * 14;
        const rotX = 3 - ny * 12;
        tiltCard.style.transform = `perspective(1000px) rotateY(${rotY.toFixed(2)}deg) rotateX(${rotX.toFixed(2)}deg)`;

        hero.querySelectorAll('[data-parallax]').forEach(el => {
          const depth = parseFloat(el.getAttribute('data-parallax')) || 10;
          el.style.transform = `translate3d(${(nx * depth).toFixed(1)}px, ${(ny * depth).toFixed(1)}px, 0)`;
        });
      });

      hero.addEventListener('mouseleave', () => {
        tiltCard.style.transform = 'perspective(1000px) rotateY(-6deg) rotateX(3deg)';
      });
    }

            await savePengaturan({
              namaSekolah: fd.get('namaSekolah').trim(),
              tagline: fd.get('tagline').trim(),
              telepon: fd.get('telepon').trim(),
              email: fd.get('email').trim(),
              alamat: fd.get('alamat').trim(),
              sambutan: fd.get('sambutan').trim()
            });
            showToast("Pengaturan sekolah berhasil disimpan!");
            render();
          } catch (err) {
            showToast("Gagal menyimpan pengaturan.", "error");
          }
        };
      }

      if (state.view === 'public') {
        initHeroInteractions();
      }
    }

    // =========================================================================
    // MAIN RENDER FUNCTION & BOOTSTRAP
    // =========================================================================
    function render() {
      const container = document.getElementById('app-content');
      if (state.view === 'public') {
        container.innerHTML = renderPublicPage();
      } else if (state.view === 'login') {
        container.innerHTML = renderLoginPage();
      } else if (state.view === 'ortu' && state.currentUser?.role === 'ortu') {
        container.innerHTML = renderOrtuDashboard();
      } else if (state.view === 'admin' && state.currentUser?.role === 'admin') {
        container.innerHTML = renderAdminDashboard();
      } else {
        state.view = 'public';
        container.innerHTML = renderPublicPage();
      }
      bindEvents();
      document.getElementById('tk-app-shell').scrollTo({ top: 0, behavior: 'instant' });
    }

    // Bootstrap Aplikasi
    async function initApp() {
      if (!IS_PREVIEW && db) {
        await loadPublicData();
        if (auth) {
          onAuthStateChanged(auth, async (user) => {
            if (user && state.view === 'admin') {
              state.currentUser = { role: 'admin', data: { email: user.email, uid: user.uid } };
              await loadAdminData();
              render();
            }
          });
        }
      }
      render();
    }

    initApp();
  </script>
</body>
</html>
